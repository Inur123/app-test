name: Auto Deploy Laravel via FTP (Single Account)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1) Upload semua source Laravel ke /laravel_app (kecuali folder public)
      - name: Deploy Source Code to laravel_app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: /laravel_app/
          exclude: |
            **/.git*
            **/.github/**
            public/**

      # 2) Upload isi folder public ke /public_html (domain utama)
      - name: Deploy Public Folder to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: public/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.github/**
