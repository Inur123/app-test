name: Auto Deploy Laravel via FTP (Build + Upload)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Setup PHP + Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, zip, gd, intl, bcmath, curl, fileinfo
          tools: composer

      # ✅ Cache composer (biar cepat)
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # ✅ Install composer dependencies -> vendor/
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # ✅ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # ✅ Install npm deps (lebih stabil dari npm install)
      - name: Install Node Dependencies
        run: npm ci

      # ✅ Build Vite -> public/build
      - name: Build Frontend
        run: npm run build

      # ✅ Cek output build supaya yakin (akan muncul di log)
      - name: Check Build Output
        run: |
          echo "=== public folder ==="
          ls -la public
          echo "=== public/build ==="
          ls -la public/build || true
          echo "=== public/dist ==="
          ls -la public/dist || true

      # ✅ Deploy source (excluding public folder)
      - name: Deploy Source to laravel_app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: /laravel_app/
          exclude: |
            **/.git*
            **/.github/**
            public/**
            **/.env
            **/node_modules/**

      # ✅ Deploy public folder to public_html
      - name: Deploy Public to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: public/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.github/**
