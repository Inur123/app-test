name: Auto Deploy Laravel via FTP (Build + Upload)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, zip
          tools: composer

      # ✅ Install composer dependencies -> vendor/
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      # ✅ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ✅ Install npm deps
      - name: Install Node Dependencies
        run: npm install

      # ✅ Build Vite -> public/build
      - name: Build Frontend
        run: npm run build

      # ✅ Deploy source (excluding public folder)
      - name: Deploy Source to laravel_app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: /laravel_app/
          exclude: |
            **/.git*
            **/.github/**
            public/**
            **/.env

      # ✅ Deploy public folder to public_html
      - name: Deploy Public to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: public/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.github/**
